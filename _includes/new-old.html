<nav class="post-nav" aria-label="相邻文章">
  {% if page.previous.url %}
    <a class="post-nav__item" href="{{ page.previous.url | prepend: site.baseurl }}">
      <span>上一篇</span>
      <strong>{{ page.previous.title }}</strong>
    </a>
  {% endif %}

  {% if page.next.url %}
    <a class="post-nav__item" href="{{ page.next.url | prepend: site.baseurl }}">
      <span>下一篇</span>
      <strong>{{ page.next.title }}</strong>
    </a>
  {% endif %}
</nav>
