{% if paginator.total_pages > 1 %}
  <nav class="pagination" aria-label="分页">
    {% if paginator.previous_page %}
      <a class="button button--ghost" href="{{ paginator.previous_page_path | prepend: site.baseurl }}">上一页</a>
    {% endif %}

    <span>{{ paginator.page }} / {{ paginator.total_pages }}</span>

    {% if paginator.next_page %}
      <a class="button button--ghost" href="{{ paginator.next_page_path | prepend: site.baseurl }}">下一页</a>
    {% endif %}
  </nav>
{% endif %}
