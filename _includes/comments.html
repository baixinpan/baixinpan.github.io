{% if site.comment.livere or site.comment.disqus %}
  <section class="shell post-comments">
    {% if site.comment.livere %}
      <div id="lv-container" data-id="city" data-uid="{{ site.comment.livere }}"></div>
    {% elsif site.comment.disqus %}
      <div id="disqus_thread"></div>
    {% endif %}
  </section>
{% endif %}
