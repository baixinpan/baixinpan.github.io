<!DOCTYPE html>
<html lang="zh-CN">
  {% include head.html %}

  <body>
    <a class="skip-link" href="#main">跳到正文</a>

    <div class="mobile btn-mobile-menu" aria-label="移动端导航">
      <nav class="nav-menu-item">
        <a href="/#blog" title="{{ site.blog_button.description }}" class="blog-button">{{ site.blog_button.title }}</a>
        {% for item in site.nav %}
          <a href="{{ item.url }}" title="{{ item.description }}" class="btn-mobile-menu__icon">{{ item.title }}</a>
        {% endfor %}
      </nav>
    </div>

    {% include side-panel.html %}

    <main id="main" class="content-wrapper">
      <div class="content-wrapper__inner">
        {{ content }}
      </div>
    </main>

    {% include footer.html %}
    {% include external.html %}
  </body>
</html>
